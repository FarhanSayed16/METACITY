name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd backend && pip install -e ".[dev]"
      - run: cd backend && ruff check .
      - run: cd backend && pytest -x
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd backend && pip install -e ".[dev]"
      - run: cd frontend && npm ci --legacy-peer-deps && npm run build
      - name: OpenAPI TypeScript drift check
        run: |
          cd frontend
          npm run typegen
          git diff --exit-code -- src/lib/api-types.ts openapi.json || (
            echo "::error::OpenAPI types drifted. Run: cd frontend && npm run typegen"
            exit 1
          )
